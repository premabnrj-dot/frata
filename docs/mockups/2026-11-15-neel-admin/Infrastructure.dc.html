<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Infrastructure</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F37A3;text-decoration:none}a:hover{color:#272D82}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid #E3E1DD;background:#FFFFFF;color:#171615;font:inherit;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:3px;background:currentColor}
.bad{background:#FDECEC;color:#A82828}.warn{background:#FDF3DC;color:#85500B}
.tab{display:inline-flex;align-items:center;gap:6px;height:40px;color:#67625C;font-weight:500}
.tab[aria-current]{color:#171615;box-shadow:inset 0 -2px 0 #3A44C2}
.tn{border-radius:10px;padding:2px 6px;font-size:12px;background:#EEEDEA;color:#67625C}
.lab{font-size:13px;color:#67625C}
.kpi{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:10px;background:#F6F5F3}
.kpi b{font-size:20px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.fold{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border:1px dashed #EEEDEA;border-radius:12px}
</style>
</helmet>
<div style="width: 1280px; height: 860px; box-sizing: border-box; display: flex; background: #FFFFFF; color: #171615; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 20px;">
  <div aria-hidden="true" style="width: 232px; flex: none; background: #171615;"></div>
  <main style="flex: 1; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; max-width: 1000px;">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600;">Infrastructure</h1>
    <nav aria-label="Providers" style="display: flex; gap: 20px; border-bottom: 1px solid #E3E1DD;">
      <a class="tab" href="#">Vercel</a><a class="tab" href="#">Mux</a><a class="tab" href="#" aria-current="page">Supabase <span class="tn" style="background: #FDECEC; color: #A82828;">1</span></a>
    </nav>
    <section aria-labelledby="ny-h" style="border: 1px solid #E3E1DD; border-radius: 12px; overflow: hidden;">
      <h2 id="ny-h" style="margin: 0; padding: 14px 20px 6px; font-size: 15px; font-weight: 600;">Needs you</h2>
      <div style="display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 16px; align-items: center; padding: 10px 20px 14px;">
        <span class="chip bad">Now</span><span><b style="font-weight: 500;">Outbox has 214 waiting for 12 min.</b> <span class="lab">Messages to couriers and WhatsApp are late.</span></span>
      </div>
    </section>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
      <div class="kpi"><span class="lab">Plan</span><b>Pro</b></div>
      <div class="kpi"><span class="lab">Database</span><b>2.1 GB</b></div>
      <div class="kpi"><span class="lab">Connections</span><b>38 of 90</b></div>
      <div class="kpi"><span class="lab">Cache hits</span><b>99.6%</b></div>
    </div>
    <button type="button" class="fold" aria-expanded="false" style="font: inherit; background: #FFFFFF; text-align: left; cursor: pointer;"><b style="font-weight: 500;">Now · connections and queues</b><span class="lab">Show</span></button>
    <button type="button" class="fold" aria-expanded="false" style="font: inherit; background: #FFFFFF; text-align: left; cursor: pointer;"><b style="font-weight: 500;">Slowest queries</b><span class="lab">Show</span></button>
    <button type="button" class="fold" aria-expanded="false" style="font: inherit; background: #FFFFFF; text-align: left; cursor: pointer;"><b style="font-weight: 500;">Biggest tables</b><span class="lab">Show</span></button>
    <button type="button" class="fold" aria-expanded="false" style="font: inherit; background: #FFFFFF; text-align: left; cursor: pointer;"><b style="font-weight: 500;">Alert rules</b><span class="lab">Show</span></button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

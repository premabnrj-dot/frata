<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · EkCode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F37A3;text-decoration:none}a:hover{color:#272D82}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid #E3E1DD;background:#FFFFFF;color:#171615;font:inherit;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer}
.btn.p{background:#3A44C2;border-color:#3A44C2;color:#FFFFFF}
.tab{display:inline-flex;align-items:center;gap:6px;height:40px;color:#67625C;font-weight:500}
.tab[aria-current]{color:#171615;box-shadow:inset 0 -2px 0 #3A44C2}
.lab{font-size:13px;color:#67625C}
.kpi{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:10px;background:#F6F5F3}
.kpi b{font-size:20px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}
th{font-weight:500;font-size:13px;color:#67625C;text-align:left;padding:10px 16px;border-bottom:1px solid #E3E1DD}
td{padding:12px 16px;border-bottom:1px solid #EEEDEA;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 1280px; height: 860px; box-sizing: border-box; display: flex; background: #FFFFFF; color: #171615; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 20px;">
  <div aria-hidden="true" style="width: 232px; flex: none; background: #171615;"></div>
  <main style="flex: 1; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px;">
    <header style="display: flex; align-items: center; justify-content: space-between;">
      <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600;">EkCode</h1>
      <div style="display: flex; gap: 8px;"><button type="button" class="btn">Block a number</button><button type="button" class="btn">Edit limits</button></div>
    </header>
    <section aria-label="Needs you" style="display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-radius: 12px; background: #FDF3DC; color: #85500B; max-width: 960px;">
      <span style="flex: 1;"><b style="font-weight: 600;">Kesar Studio's breaker tripped.</b> 41 codes in 10 minutes, 12% right. Codes paused for this store.</span>
      <button type="button" class="btn">Reset breaker</button>
    </section>
    <nav aria-label="EkCode" style="display: flex; gap: 20px; border-bottom: 1px solid #E3E1DD; max-width: 960px;">
      <a class="tab" href="#" aria-current="page">Overview</a><a class="tab" href="#">Stores</a><a class="tab" href="#">Blocked</a>
    </nav>
    <div role="radiogroup" aria-label="Period" style="display: inline-flex; gap: 2px; background: #F6F5F3; border-radius: 8px; padding: 3px; align-self: flex-start;"><button type="button" role="radio" aria-checked="false" style="height: 28px; border: 0; background: transparent; font: inherit; font-size: 13px; color: #67625C; padding: 0 10px;">Today</button><button type="button" role="radio" aria-checked="true" class="btn" style="height: 28px; border: 0;">7 days</button><button type="button" role="radio" aria-checked="false" style="height: 28px; border: 0; background: transparent; font: inherit; font-size: 13px; color: #67625C; padding: 0 10px;">30 days</button></div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; max-width: 960px;">
      <div class="kpi"><span class="lab">Accounts</span><b>12,480</b></div>
      <div class="kpi"><span class="lab">Signed in</span><b>3,912</b></div>
      <div class="kpi"><span class="lab">On 2 or more stores</span><b>418</b></div>
      <div class="kpi"><span class="lab">Meta cost</span><b>₹1,206</b></div>
    </div>
    <table style="border-collapse: collapse; width: 100%; max-width: 960px;">
      <thead><tr><th>Step</th><th>Shoppers</th><th>Of the step before</th></tr></thead>
      <tbody>
        <tr><td>Asked for a code</td><td>5,204</td><td>—</td></tr>
        <tr><td>Typed it right</td><td>4,688</td><td>90%</td></tr>
        <tr><td>Continued to pay</td><td>3,912</td><td>83%</td></tr>
      </tbody>
    </table>
  </main>
</div>
</x-dc>

  renderVals() { return {}; }
}
</script>
</body>
</html>

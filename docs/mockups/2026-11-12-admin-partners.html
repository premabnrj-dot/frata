<style>
/* Layout: Frrata Admin (staff only). Left nav of Admin's sections; Partners has a list, a partner page with tabs,

:root {

  --ok: #16301F; --ok-t: #7FD3A2; --warn: #352A0C; --warn-t: #F4C766; --bad: #3A1517; --bad-t: #FF8A8E; --info: #1A2238; --info-t: #9DB2FF; --code: #211F1D; --scrim: rgb(0 0 0 / .6); color-scheme: dark } }
:root[data-theme="dark"] { --bg: #141211; --fg: #EDEAE6; --card: #1C1A18; --muted: #262320; --sub: #A9A29B; --line: #34302C; --input: #6E6760; --ink: #EDEAE6; --on-ink: #141211; --rani: #FF4F93; --rani-text: #FF7DAE;
  --ok: #16301F; --ok-t: #7FD3A2; --warn: #352A0C; --warn-t: #F4C766; --bad: #3A1517; --bad-t: #FF8A8E; --info: #1A2238; --info-t: #9DB2FF; --code: #211F1D; --scrim: rgb(0 0 0 / .6); color-scheme: dark }

@keyframes spin { to { transform: rotate(360deg) } }

<script>
(() => {
'use strict'
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)]

const ico = (n, c = 'i') => `<i data-lucide="${n}" class="${c}"></i>`

const inr = (n) => '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 })
const S = { role: 'admin', proto: 'normal', tab: 'active', ptab: 'overview', open: 'pixel' }
const admin = () => S.role === 'admin'
$('#theme').onclick = () => { const d = document.documentElement; const dark = d.dataset.theme ? d.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; d.dataset.theme = dark ? 'light' : 'dark' }
function toast(text, kind = 'ok', action) {
  const box = $('#toasts'); box.innerHTML = ''; const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', kind === 'bad' ? 'alert' : 'status')
  t.innerHTML = `<span class="mk ${kind}">${ico(kind === 'ok' ? 'check' : kind === 'bad' ? 'alert-circle' : 'info', 'i i-sm')}</span><span class="tx">${text}</span>`
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.run(); t.remove() }; t.append(b) }
  box.append(t); icons(t); if (kind !== 'bad') setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 200) }, 4200)

function modal({ title, pic, body, foot, onOpen }) {
  const w = document.createElement('div'); w.className = 'modal-wrap'
  w.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mh">${pic || ''}<h2 id="mt">${title}</h2><button class="btn sm ghost" data-x aria-label="Close">${ico('x', 'i i-sm')}</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`

}

$('#p-body').addEventListener('click', (e) => {
  const o = e.target.closest('[data-open]'); if (o) { S.open = o.dataset.open; S.ptab = 'overview'; location.hash = '#partner' }
  if (e.target.closest('[data-retry]')) { S.proto = 'normal'; $('#proto').value = 'normal'; renderList() }

function approve(q) {
  const risky = q.checks.some(([k]) => k === 'bad')
  modal({ title: `Approve ${esc(q.n)}?`, pic: pic('handshake', 'var(--ok)', 'var(--ok-t)'),
    body: `${q.checks.map(([k, t]) => `<div class="check ${k}"><span class="ic">${ico(k === 'ok' ? 'check' : k === 'warn' ? 'alert-triangle' : 'x', 'i i-sm')}</span>${t}</div>`).join('')}<div class="kv"><span>On approval</span><b>10 credits, once · Partner (free)</b></div>${risky ? `<div class="field"><label for="ap-why">Why approve despite the warning</label><textarea id="ap-why" class="input" rows="2" aria-describedby="ap-err"></textarea><span id="ap-err"></span></div>` : ''}<div id="ap-pk"></div>`,
    foot: `<button class="btn" data-x>Cancel</button><button class="btn primary" id="ap-ok" data-autofocus>Approve</button>`,
    onOpen: (m, close) => { $('#ap-ok', m).onclick = async () => { if (risky && !$('#ap-why', m).value.trim()) { $('#ap-why', m).setAttribute('aria-invalid', 'true'); $('#ap-err', m).innerHTML = `<span class="err-line">${ico('alert-circle', 'i i-sm')}Say why: it goes in the audit log</span>`; icons(m); $('#ap-why', m).focus(); return } await passkey(m, '#ap-pk'); close(); QUEUE.splice(QUEUE.indexOf(q), 1); renderList(); toast(`${q.n} approved. 10 credits added; welcome email queued.`) } } })
}
function decline(q) {
  modal({ title: `Decline ${esc(q.n)}?`, pic: pic('x', 'var(--bad)', 'var(--bad-t)'),
    body: `<div class="field"><label for="dc-why">Reason they’ll read</label><select id="dc-why" class="input"><option>We couldn’t verify your work links</option><option>This device or payout account belongs to another partner</option><option>Not a fit for now</option></select></div>`,
    foot: `<button class="btn" data-x>Cancel</button><button class="btn danger" id="dc-ok">Decline</button>`,
    onOpen: (m, close) => { $('#dc-ok', m).onclick = () => { close(); QUEUE.splice(QUEUE.indexOf(q), 1); renderList(); toast(`${q.n} declined.`) } } })
}

  const mr = e.target.closest('[data-merchant]'); if (mr) toast(`Opens ${mr.dataset.merchant} in Merchants.`, 'info')
  const rf = e.target.closest('[data-refund]'); if (rf) modal({ title: `Refund ${rf.dataset.refund}?`, pic: pic('undo-2', 'var(--warn)', 'var(--warn-t)'), body: `<div class="field"><label for="rf-why">Why</label><select id="rf-why" class="input"><option>Charged twice</option><option>Charged in error</option></select></div><div class="kv"><span>Goes back to</span><b>The same UPI · 5–7 working days</b></div><div class="kv"><span>Also</span><b>Credits removed · credit note issued</b></div><div id="rf-pk"></div>`, foot: `<button class="btn" data-x>Cancel</button><button class="btn danger" id="rf-ok">Refund</button>`, onOpen: (m, close) => { $('#rf-ok', m).onclick = async () => { await passkey(m, '#rf-pk'); close(); toast('Refund started. Credit note CN/26-27/0007 issued.') } } })
  if (e.target.closest('[data-hold]')) modal({ title: 'Hold October’s payout?', pic: pic('pause', 'var(--warn)', 'var(--warn-t)'), body: `<div class="field"><label for="h-why">Reason the partner reads</label><input id="h-why" class="input" value="A brand’s refund is under review"></div>`, foot: `<button class="btn" data-x>Cancel</button><button class="btn primary" data-x data-held>Hold</button>` })
})
document.addEventListener('click', (e) => { if (e.target.closest('[data-saved]')) toast('Note saved.'); if (e.target.closest('[data-held]')) toast('October held. The partner sees the reason on their statement.') })
function grant(p) {
  modal({ title: `Grant credits to ${esc(p.n)}`, pic: pic('gift', 'var(--info)', 'var(--info-t)'),
    body: `<div class="field"><label for="g-n">Credits</label><input id="g-n" class="input" inputmode="numeric" value="50" aria-describedby="g-err" style="max-width:140px"><span id="g-err"></span></div>
      <div class="field"><label for="g-why">Reason</label><select id="g-why" class="input"><option>Outage on Frrata’s side</option><option>Goodwill</option><option>Pilot programme</option><option>Correction</option></select></div>
      <div class="field"><label for="g-note">Note for the audit log</label><textarea id="g-note" class="input" rows="2" aria-describedby="g-nerr"></textarea><span id="g-nerr"></span></div>
      <div class="kv"><span>Lasts</span><b>12 months · shows as “Frrata grant”</b></div><div class="kv"><span>Costs Frrata</span><b id="g-cost">${inr(50 * 6.33)} measured</b></div><div id="g-pk"></div>`,
    foot: `<button class="btn" data-x>Cancel</button><button class="btn primary" id="g-ok">Grant</button>`,
    onOpen: (m, close) => {
      const n = $('#g-n', m); n.oninput = () => { const v = +n.value.replace(/\D/g, '') || 0; $('#g-cost', m).textContent = `${inr(Math.round(v * 633) / 100)} measured${v > 200 ? ' · needs a second admin' : ''}`; n.removeAttribute('aria-invalid'); $('#g-err', m).innerHTML = '' }
      $('#g-ok', m).onclick = async () => {
        const v = +n.value.replace(/\D/g, '') || 0, note = $('#g-note', m).value.trim(); let bad = false
        if (!v || v > 1000) { n.setAttribute('aria-invalid', 'true'); $('#g-err', m).innerHTML = `<span class="err-line">${ico('alert-circle', 'i i-sm')}${v ? 'Up to 1,000 at a time' : 'Enter a number of credits'}</span>`; bad = true }
        if (!note) { $('#g-note', m).setAttribute('aria-invalid', 'true'); $('#g-nerr', m).innerHTML = `<span class="err-line">${ico('alert-circle', 'i i-sm')}Add a note: it goes in the audit log</span>`; bad = true }
        if (bad) { icons(m); (n.getAttribute('aria-invalid') ? n : $('#g-note', m)).focus(); return }
        await passkey(m, '#g-pk'); close()
        if (v > 200) toast(`${v} credits waiting for a second admin. Sent to Sneha.`, 'info')
        else { p.bal += v; LEDGER.unshift(['Now', 'Grant', '—', `${$('#g-why', m).value} · ${note}`, 'Vikram', v, p.bal]); renderPartner(); toast(`${v} credits granted to ${p.n}.`) }
      }
    } })
}
function returnTurn(p) {
  modal({ title: 'Return a failed turn', pic: pic('undo-2', 'var(--info)', 'var(--info-t)'),
    body: `<div class="field"><label for="rt">Turn</label><select id="rt" class="input"><option>12 Nov 16:02 · Kesar Studio · build · 31 credits</option><option>12 Nov 11:12 · Noor Threads · 6 credits</option></select></div><div class="kv"><span>Rule</span><b>Only when it failed on Frrata’s side</b></div><div class="field"><label for="rt-why">What failed</label><input id="rt-why" class="input" value="Build host timed out (incident #41)"></div>`,
    foot: `<button class="btn" data-x>Cancel</button><button class="btn primary" id="rt-ok">Return</button>`,
    onOpen: (m, close) => { $('#rt-ok', m).onclick = () => { close(); p.bal += 31; LEDGER.unshift(['Now', 'Returned', 'Kesar Studio', 'Build · Frrata-side failure', 'Vikram', 31, p.bal]); renderPartner(); toast('31 credits returned.') } } })
}
function suspend(p) {
  modal({ title: `Suspend ${esc(p.n)}?`, pic: pic('ban', 'var(--bad)', 'var(--bad-t)'),
    body: `${['All ' + p.team + ' people lose access to every brand now', 'Studio sessions and routines stop; drafts are kept', 'Brands’ shops and sites keep running', 'Payouts are held until a decision', 'Brands are told their partner is paused'].map((t) => `<div class="check warn"><span class="ic">${ico('arrow-right', 'i i-sm')}</span>${t}</div>`).join('')}
      <div class="field"><label for="s-why">Reason (partner and audit log)</label><select id="s-why" class="input"><option>Farming free credits</option><option>Payment fraud</option><option>Shopper data misuse</option><option>Breach of partner terms</option></select></div>
      <div class="field"><label for="s-name">Type <b>${esc(p.n)}</b> to confirm</label><input id="s-name" class="input" autocomplete="off" aria-describedby="s-err"><span id="s-err"></span></div><div id="s-pk"></div>`,
    foot: `<button class="btn" data-x>Cancel</button><button class="btn danger" id="s-ok">Suspend</button>`,
    onOpen: (m, close) => { $('#s-ok', m).onclick = async () => { const v = $('#s-name', m).value.trim(); if (v !== p.n) { $('#s-name', m).setAttribute('aria-invalid', 'true'); $('#s-err', m).innerHTML = `<span class="err-line">${ico('alert-circle', 'i i-sm')}Type the name exactly</span>`; icons(m); $('#s-name', m).focus(); return } await passkey(m, '#s-pk'); close(); p.st = 'suspended'; renderPartner(); toast(`${p.n} suspended. Access ended for ${p.team} people; ${p.live + p.onb} brands told.`) } } })
}

/* ── Studio credits across partners ── */
function renderCredits() {
  const c = $('#cr')
  if (S.proto === 'loading') { c.innerHTML = '<div class="card pad"><span class="skel" style="width:50%"></span><span class="skel"></span></div>'; return }
  const sold = P.reduce((a, p) => a + p.spent, 0), held = P.reduce((a, p) => a + p.bal, 0)
  c.innerHTML = `<div class="vhead"><div><div class="eyebrow"><i data-lucide="coins" class="i i-sm"></i>Partners</div><h1>Studio credits</h1></div><div class="seg"><button aria-pressed="true">November</button><button aria-pressed="false">October</button></div></div>
    <div class="kpis"><div><b>${sold.toLocaleString('en-IN')}</b>Credits used</div><div><b>${inr(sold * 19)}</b>Sold (ex GST)</div><div><b>${inr(Math.round(sold * 633) / 100)}</b>Measured cost</div><div><b>3.0×</b>Price ÷ cost</div><div><b>${held.toLocaleString('en-IN')}</b>Held, unused</div><div><b>2.1%</b>Turns failed on our side</div></div>
    <div class="two"><div class="card tbl-wrap"><table class="tbl" style="min-width:560px"><thead><tr><th>Partner</th><th class="n">Used</th><th class="n">Sold</th><th class="n">Held</th><th class="n">Expiring 30 days</th></tr></thead><tbody>${P.map((p) => `<tr class="click" data-open="${p.id}"><td>${p.n}</td><td class="n">${p.spent}</td><td class="n">${inr(p.spent * 19)}</td><td class="n">${p.bal}</td><td class="n">${p.id === 'kalam' ? 120 : p.id === 'pixel' ? 0 : '—'}</td></tr>`).join('')}</tbody></table></div>
    <div style="display:grid;gap:16px"><div class="card pad"><h2>Grants this month</h2><div class="kv"><span>Pixel &amp; Thread · outage</span><b>+31 · Vikram</b></div><div class="kv"><span>Kalam Studio · pilot</span><b>+300 · Vikram, Sneha</b></div><div class="kv"><span>Free credits on approval</span><b>4 × 10</b></div></div>
    <div class="card pad"><h2>Held credits are owed work</h2><span class="sub" style="font-size:12.5px">${held.toLocaleString('en-IN')} credits paid for and unused (≈ ${inr(held * 19)}): income only as they’re used or expire.</span></div></div></div>`
  icons(c)
}
$('#cr').addEventListener('click', (e) => { const o = e.target.closest('[data-open]'); if (o) { S.open = o.dataset.open; S.ptab = 'credits'; location.hash = '#partner' } })

/* ── Payout run ── */
const RUN = [['Pixel & Thread LLP', 9874, true, 'ready'], ['Kalam Studio', 31240, true, 'ready'], ['Dhaga Digital', 704.8, true, 'carry'], ['Aarav Mehta', 0, false, 'none'], ['Bunkar Collective', 1409.6, true, 'kyc']]
function renderPayouts() {
  const ready = RUN.filter((r) => r[3] === 'ready'), tot = ready.reduce((a, r) => a + r[1] + (r[2] ? Math.round(r[1] * 18) / 100 : 0) - Math.round(r[1] * 2) / 100, 0)
  $('#po').innerHTML = `<div class="vhead"><div><div class="eyebrow"><i data-lucide="banknote" class="i i-sm"></i>Partners</div><h1>Payouts · October</h1></div>${adminOnly(`<button class="btn primary" data-run ${S.ran ? 'aria-disabled="true"' : ''}>${ico('send', 'i i-sm')}${S.ran ? 'Queued' : `Pay ${ready.length} · ${inr(tot)}`}</button>`)}</div>
    <div class="note" style="padding-top:0">${ico('calendar', 'i i-sm')}Statements on the 5th; paid 30 days later; under ₹1,000 carries forward. Payouts go through the outbox to RazorpayX (Phase 6).</div>
    <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Partner</th><th class="n">20%</th><th class="n">+ GST</th><th class="n">− TDS 2%</th><th class="n">Net</th><th>Status</th></tr></thead><tbody>${RUN.map(([n, g, gst, s]) => { const G = gst ? Math.round(g * 18) / 100 : 0, T = Math.round(g * 2) / 100; return `<tr><td>${n}</td><td class="n">${inr(g)}</td><td class="n">${gst ? inr(G) : '—'}</td><td class="n">${g ? '−' + inr(T) : '—'}</td><td class="n">${inr(g + G - T)}</td><td>${s === 'ready' ? `<span class="badge ${S.ran ? 'info' : 'ok'}">${S.ran ? 'Queued' : 'Ready'}</span>` : s === 'carry' ? '<span class="badge">Under ₹1,000 · carried</span>' : s === 'kyc' ? '<span class="badge warn">Bank not verified</span>' : '<span class="badge">Nothing due</span>'}</td></tr>` }).join('')}</tbody></table></div>`
  icons($('#po'))
}
$('#po').addEventListener('click', (e) => {
  const r = e.target.closest('[data-run]'); if (!r) return
  if (r.getAttribute('aria-disabled') === 'true') { toast(S.ran ? 'Already queued.' : 'Support can look; only admins pay out.', 'info'); return }
  modal({ title: 'Pay October’s share?', pic: pic('banknote', 'var(--ok)', 'var(--ok-t)'), body: `<div class="kv"><span>Partners</span><b>2 ready · 1 carried · 1 waiting on bank</b></div><div class="kv"><span>Each</span><b>One outbox row, keyed by statement id</b></div><div id="r-pk"></div>`, foot: `<button class="btn" data-x>Cancel</button><button class="btn primary" id="r-ok">Pay</button>`,
    onOpen: (m, close) => { $('#r-ok', m).onclick = async () => { await passkey(m, '#r-pk'); close(); S.ran = true; renderPayouts(); toast('2 payouts queued. Partners get their statements by email.') } } })
})

/* ── Routing, role, states ── */
function show() {
  let v = (location.hash || '#partners').slice(1); if (!['partners', 'partner', 'credits', 'payouts'].includes(v)) v = 'partners'
  $$('section[data-view]').forEach((s) => { s.hidden = s.dataset.view !== v })
  $$('.nav a[data-nav]').forEach((a) => a.dataset.nav === (v === 'partner' ? 'partners' : v) ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'))
  if (v === 'partners') renderList(); if (v === 'partner') renderPartner(); if (v === 'credits') renderCredits(); if (v === 'payouts') renderPayouts()
  scrollTo(0, 0)
}
$('#role').onchange = (e) => { S.role = e.target.value; show(); toast(S.role === 'admin' ? 'Viewing as an admin.' : 'Viewing as support: money and access actions are off.', 'info') }
$('#proto').onchange = (e) => { S.proto = e.target.value; show() }
addEventListener('hashchange', show)
icons(document.body); show()
})()
</script>

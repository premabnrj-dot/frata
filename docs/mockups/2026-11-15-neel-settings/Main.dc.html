<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings, by group</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171615;text-decoration:none}
</style>
</helmet>
<div style="width: 1280px; height: 760px; box-sizing: border-box; padding: 28px 32px 28px 264px; background: #FFFFFF; color: #171615; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; gap: 20px; position: relative;">
  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 232px; background: #FBFAF9; border-right: 1px solid #E3E1DD;"></div>
  <header style="display: flex; justify-content: space-between; align-items: center; max-width: 960px;">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600;">Settings</h1>
    <span style="display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 2px 8px; background: #E3F4E8; color: #1F5F33; font-size: 13px; font-weight: 500;"><i style="width: 6px; height: 6px; border-radius: 3px; background: #2E8B4E;"></i>Ready for live payments</span>
  </header>
  <div style="display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; align-items: start; max-width: 960px;">
    <nav aria-label="Settings groups" style="display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
        <button type="button" onClick="{{g.pick}}" aria-current="{{g.current}}" style="{{g.style}}">
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;"><b style="font-weight: 500;">{{g.name}}</b><span style="font-size: 13px; color: #67625C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{g.sub}}</span></span>
          <sc-if value="{{g.fix}}" hint-placeholder-val="{{false}}"><span style="border-radius: 6px; padding: 1px 7px; background: #FDF1DC; color: #7A4A00; font-size: 12px; font-weight: 500;">{{g.fix}}</span></sc-if>
        </button>
      </sc-for>
    </nav>
    <section aria-labelledby="gh" style="display: flex; flex-direction: column; gap: 8px;">
      <h2 id="gh" style="margin: 0; font-size: 15px; font-weight: 600;">{{group.name}}</h2>
      <div style="border: 1px solid #E3E1DD; border-radius: 12px; overflow: hidden;">
        <sc-for list="{{group.rows}}" as="r" hint-placeholder-count="3">
          <a href="{{r.href}}" style="{{r.style}}"><b style="font-weight: 500;">{{r.title}}</b><span style="display: flex; justify-content: flex-end; min-width: 0;"><span style="{{r.valueStyle}}">{{r.value}}</span></span><span aria-hidden="true" style="color: #67625C;">›</span></a>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
const GROUPS = [
  { key: 'store', name: 'Store', sub: 'Details, web address, contact, policies', rows: [
    ['Store details', 'Kesar Studio · logo · “Handloom for every day”'], ['Web address', 'kesarstudio.in'],
    ['Contact and grievance officer', 'care@kesarstudio.in · Riya Shah'], ['Policies', '7-day returns · 5 pages']] },
  { key: 'checkout', name: 'Checkout', sub: 'Online payments, Pay on delivery, shipping', rows: [
    ['Online payments', 'Live · UPI, cards, netbanking'], ['Pay on delivery', 'On · up to ₹3,000 · fee ₹49', 'Section.dc.html'], ['Shipping and delivery', '₹79 · free above ₹1,499 · 2 days']] },
  { key: 'tax', name: 'Business and tax', sub: 'GST, invoices and slips, your costs', fix: '1', rows: [
    ['Business and GST', 'Kesar Crafts LLP · 27ABCDE1234F1Z5'], ['Invoices and slips', 'KS/ series · A4 slips · signed Riya Shah'], ['Your shipping costs', 'Not confirmed', null, true]] },
  { key: 'messages', name: 'Messages', sub: 'Emails to shoppers, your notifications', rows: [
    ['Emails to shoppers', '4 on'], ['Your notifications', 'Email']] },
  { key: 'team', name: 'Team and plan', sub: 'People, plan and billing', rows: [
    ['People', '3 people'], ['Plan and billing', 'Growth · ₹4,999 a month']] },
];
const ROW = 'display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px) 16px; gap: 14px; align-items: center; padding: 14px 20px;';
const BTN = 'display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; width: 100%; min-height: 56px; padding: 10px 14px; border-radius: 10px; font: inherit; color: #171615; cursor: pointer;';
class Component extends DCLogic {
  state = { at: 'checkout' };
  renderVals() {
    const at = this.state.at;
    const g = GROUPS.find((x) => x.key === at);
    return {
      groups: GROUPS.map((x) => ({ name: x.name, sub: x.sub, fix: x.fix || '', current: x.key === at ? 'true' : 'false',
        style: BTN + (x.key === at ? ' background: #EEF0FC; border: 1px solid #C9CEF5;' : ' background: transparent; border: 1px solid transparent;'),
        pick: () => this.setState({ at: x.key }) })),
      group: { name: g.name, rows: g.rows.map((r, i) => ({ title: r[0], value: r[1], href: r[2] || '#',
        style: ROW + (i ? ' border-top: 1px solid #EEEDEA;' : ''),
        valueStyle: r[3] ? 'border-radius: 6px; padding: 2px 8px; background: #FDF1DC; color: #7A4A00; font-size: 13px; font-weight: 500;' : 'color: #67625C; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;' })) },
    };
  }
}
</script>
</body>
</html>
